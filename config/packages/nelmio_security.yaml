nelmio_security:
    # prevents framing of the entire site
    clickjacking:
        paths:
            '^/.*': DENY

    # disables content type sniffing for script resources
    content_type:
        nosniff: true

    # Send a full URL in the `Referer` header when performing a same-origin request,
    # only send the origin of the document to secure destination (HTTPS->HTTPS),
    # and send no header to a less secure destination (HTTPS->HTTP).
    # If `strict-origin-when-cross-origin` is not supported, use `no-referrer` policy,
    # no referrer information is sent along with requests.
    referrer_policy:
        enabled: true
        policies:
            - 'no-referrer'
            - 'strict-origin-when-cross-origin'

    # Applied on every host (no "hosts" filter: it used to restrict the CSP to local hosts only).
    # No inline script and no third-party origin: scripts are files served by the site.
    csp:
        # Only the standard Content-Security-Policy header (no X-Content-Security-Policy for IE 10/11)
        compat_headers: false
        enforce:
            # No 'unsafe-inline' fallback for CSP level 1 browsers
            level1_fallback: false
            default-src:
                - 'self'
            script-src:
                - 'self'
            style-src:
                - 'self'
            img-src:
                - 'self'
                - 'data:'
            object-src:
                - 'none'
            base-uri:
                - 'self'
            form-action:
                - 'self'
            frame-ancestors:
                - 'none'

    # Features the site never uses are disabled, including for any embedded content
    permissions_policy:
        enabled: true
        policies:
            browsing_topics: []
            camera: []
            geolocation: []
            microphone: []
            payment: []
            usb: []

    # Pages opened by the site (or opening it) cannot access its window
    cross_origin_isolation:
        enabled: true
        paths:
            '^/':
                coop: same-origin
